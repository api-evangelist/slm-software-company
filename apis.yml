name: SLM Software Company
description: >-
  SLM Software Company (SLMsoft.com) was a Toronto, Canada based developer of
  electronic payment systems and real-time transaction processing solutions for
  the financial services industry, founded in 1986. Its platform bundled a
  transaction management engine with application modules for Internet banking,
  IVR, debit and credit card issuing, ATM and point-of-sale network management,
  retail branch management, and e-CRM, along with brokerage portfolio
  management, e-health claims settlement, and e-government payment products,
  serving over 1,500 customers across 52 countries. The company was acquired by
  The InterCept Group (C$110 million) and is now permanently closed. It was
  surfaced as an Insight Partners portfolio company and added to the API
  Evangelist network as a stub; enrichment found no live API, developer portal,
  documentation, or other public developer surface to catalog.
